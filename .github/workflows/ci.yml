name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # The settings refuse to load without a SECRET_KEY unless DEBUG is on.
      DEBUG: "True"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements.lock
      # The versions the image runs, not the newest that the ranges allow.
      - run: pip install -r requirements.txt -c requirements.lock
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  # The image is what gets deployed, so build it and make sure it starts.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: docker build -t keys .
      - name: The lock file lists exactly what the image installed
        # Fails when requirements.txt changed and the lock was not refreshed
        # (the README's "Recorded dependencies" section has the command).
        run: docker run --rm keys pip freeze | diff - backend/requirements.lock
      - name: Run the backend tests inside the image
        run: docker run --rm -e DEBUG=True keys python manage.py test
      - name: Start the container and wait until it reports healthy
        run: |
          docker run -d --name keys -p 8000:8000 -e SECRET_KEY="$(openssl rand -base64 48)" keys
          for attempt in $(seq 1 30); do
            status="$(docker inspect --format '{{.State.Health.Status}}' keys)"
            if [ "$status" = healthy ]; then exit 0; fi
            sleep 2
          done
          docker logs keys
          exit 1
      - name: The API answers and the frontend is served
        run: |
          curl -fsS http://localhost:8000/api/health/
          curl -fsS http://localhost:8000/ | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/login | grep -q '<div id="root">'
          curl -fsS http://localhost:8000/favicon.svg | grep -q '<svg'
